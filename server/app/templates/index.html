    'Writing CCI file…',
  ],
  cci: [
    'Starting conversion…',
    'Opening Xbox disc image…',
    'Building CCI archive…',
    'Packaging ZIP archive…',
  ],
  folder: [
    'Starting extraction…',
    'Opening Xbox disc image…',
    'Extracting game files…',
    'Packaging ZIP archive…',
  ],
};

// Labels and filename suffixes per format
const FMT_META = {
  cue: { badge:'CUE/BIN',       source:'CHD',     suffix:' · packaging as ZIP', ext:'.zip',  errHint:'Check that chdman is installed on the server.' },
  gdi: { badge:'GDI',           source:'CHD',     suffix:' · packaging as ZIP', ext:'.zip',  errHint:'Check that chdman is installed on the server.' },
  iso: { badge:'ISO',           source:'Disc',    suffix:'',                    ext:'.iso',  errHint:'Check that the server-side converter is configured.' },
  cso: { badge:'CSO',           source:'CHD',     suffix:' · compressing',      ext:'.cso',  errHint:'Check that chdman and ciso/maxcso are installed on the server.' },
  rvz: { badge:'ISO',           source:'RVZ',     suffix:'',                    ext:'.iso',  errHint:'Check that DolphinTool is installed on the server.' },
  cia:           { badge:'CIA',  source:'3DS CART', suffix:' · decrypted',   ext:'.cia',  errHint:'Configure SYNC_ROM_3DS_CIA_COMMAND on the server (see install-3ds-rom-tools-rpi.sh).' },
  decrypted_cci: { badge:'CCI',  source:'3DS CART', suffix:' · decrypted',   ext:'.cci',  errHint:'Configure SYNC_ROM_3DS_DECRYPTED_CCI_COMMAND on the server (see install-3ds-rom-tools-rpi.sh).' },
  cci: { badge:'CCI',           source:'Xbox',    suffix:' · ZIP',              ext:'.zip',  errHint:'Configure SYNC_ROM_XBOX_CCI_COMMAND on the server.' },
  folder: { badge:'FOLDER',     source:'Xbox',    suffix:' · ZIP',              ext:'.zip',  errHint:'Configure SYNC_ROM_XBOX_FOLDER_COMMAND on the server.' },
  eboot: { badge:'EBOOT',       source:'PS1 disc', suffix:' · building PBP', ext:'.PBP', errHint:'Configure SYNC_ROM_PS1_EBOOT_COMMAND (pop-fe) on the server.' },
  vcd: { badge:'VCD',           source:'PS1 disc', suffix:' · POPStarter',   ext:'.VCD', errHint:'Configure SYNC_ROM_PS1_VCD_COMMAND on the server.' },
  psio: { badge:'PSIO',         source:'PS1 disc', suffix:' · BIN/CU2 ZIP',  ext:'.zip', errHint:'Check that chdman is installed on the server.' },
  loadiine: { badge:'LOADIINE', source:'Wii U WUP', suffix:' · decrypting',  ext:'.zip', errHint:'Configure SYNC_ROM_WIIU_LOADIINE_COMMAND (CDecrypt) on the server.' },
  wua: { badge:'WUA',           source:'Wii U WUP', suffix:' · packing',     ext:'.wua', errHint:'Configure SYNC_ROM_WIIU_WUA_COMMAND on the server.' },
};

function queueKey(titleId, fmt) {
  return `${titleId}::${fmt}`;
}

function activeQueueItem() {
  return Q.items.find(item => item.id === Q.activeId) || null;
}

function buildExtractFilename(titleId, gameName, fmt) {
  // Fallback filename when the server didn't send Content-Disposition.
  // Preserves the game-name stem verbatim — the extension is the only
  // thing that changes between variants. Adding `_decrypted` or `_cue`-
  // style markers breaks client-side save detection, which keys off the
  // filename stem.
  const meta = FMT_META[fmt] || FMT_META.cue;
  const stem = gameName.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_') || titleId;
  return `${stem}${meta.ext}`;
}

function parseContentDispositionFilename(header) {
  if (!header) return null;
  // RFC 5987 filename*=UTF-8''... takes precedence when present.
  const starMatch = header.match(/filename\*\s*=\s*(?:UTF-8|utf-8)''([^;]+)/i);
  if (starMatch) {
    try { return decodeURIComponent(starMatch[1]); } catch { /* fall through */ }
  }
  const quoted = header.match(/filename\s*=\s*"([^"]+)"/i);
  if (quoted) return quoted[1];
  const bare = header.match(/filename\s*=\s*([^;]+)/i);
  if (bare) return bare[1].trim();
  return null;
}

function toggleQueue(event) {
  event?.stopPropagation();
  const panel = qs('#queue-panel');
  if (panel.classList.contains('hidden')) openQueue();
  else closeQueue();
}

function openQueue() {
  qs('#queue-panel').classList.remove('hidden');
  qs('#queue-btn').classList.add('active');
}

function closeQueue() {
  qs('#queue-panel').classList.add('hidden');
  qs('#queue-btn').classList.remove('active');
}

function updateQueueBadge() {
  const badge = qs('#queue-badge');
  const count = Q.items.filter(item => item.status === 'queued' || item.status === 'running').length;
  badge.textContent = String(count);
  badge.classList.toggle('hidden', count === 0);
}

function trimQueueHistory() {
  const active = activeQueueItem();
  const queuedIds = new Set(Q.items.filter(item => item.status === 'queued').map(item => item.id));
  const finished = Q.items.filter(item => ['done', 'error', 'cancelled'].includes(item.status));
  const keepFinished = new Set(finished.slice(-8).map(item => item.id));
  Q.items = Q.items.filter(item =>
    item.id === active?.id || queuedIds.has(item.id) || keepFinished.has(item.id)
  );
}

function queueSummaryText() {
  const active = activeQueueItem();
  const pending = Q.items.filter(item => item.status === 'queued').length;
  if (active && pending) return `${active.gameName} is converting • ${pending} waiting`;
  if (active) return `${active.gameName} is converting`;
  if (pending) return `${pending} queued download${pending === 1 ? '' : 's'}`;
  return 'No active downloads';
}

function renderQueue() {
  updateQueueBadge();
  qs('#queue-summary').textContent = queueSummaryText();

  const active = activeQueueItem();
  const pending = Q.items.filter(item => item.status === 'queued');
  const recent = Q.items
    .filter(item => ['done', 'error', 'cancelled'].includes(item.status))
    .slice()
    .reverse();

  const sections = [];

  if (active) {
    const meta = FMT_META[active.fmt] || FMT_META.cue;
    sections.push(`
      <div class="queue-section">
        <div class="queue-label">Now converting</div>
        <div class="queue-item">
          <div class="queue-item-head">
            <div>
              <div class="queue-item-title">${esc(active.gameName)}</div>
              <div class="queue-item-meta">
                <span class="conv-fmt-badge">${meta.badge}</span>
                <span>${meta.source}${meta.suffix}</span>
              </div>
            </div>
            <div class="queue-item-actions">
              <span class="queue-state running">Running</span>
              <button class="queue-mini-btn danger" data-qaction="cancel" data-job-id="${active.id}">Cancel</button>
            </div>
          </div>
          <div class="queue-progress">
            <div class="prog-track">
              <div class="prog-bar indeterminate"></div>
            </div>
          </div>
          <div class="queue-item-status">${esc(active.stageText || 'Starting conversion…')}</div>
          <div class="queue-item-sub">${esc(active.subText || 'This may take a minute for large games')}</div>
        </div>
      </div>
    `);
  }

  if (pending.length) {
    sections.push(`
      <div class="queue-section">
        <div class="queue-label">Queued</div>
        <div class="queue-list">
          ${pending.map((item, idx) => `
            <div class="queue-item">
              <div class="queue-item-head">
                <div>
                  <div class="queue-item-title">${esc(item.gameName)}</div>
                  <div class="queue-item-meta">
                    <span class="conv-fmt-badge">${(FMT_META[item.fmt] || FMT_META.cue).badge}</span>
                    <span>#${idx + 1} in line</span>
                  </div>
                </div>
                <div class="queue-item-actions">
                  <span class="queue-state queued">Queued</span>
                  <button class="queue-mini-btn danger" data-qaction="remove" data-job-id="${item.id}">Remove</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `);
  }

  if (recent.length) {
    sections.push(`
      <div class="queue-section">
        <div class="queue-label">Recent</div>
        <div class="queue-list">
          ${recent.map(item => {
            const state = item.status === 'done' ? 'Done'
                        : item.status === 'error' ? 'Failed'
                        : 'Cancelled';
            const detail = item.status === 'done'
              ? (item.filename || 'Download started')
              : (item.error || item.subText || '');
            return `
              <div class="queue-item">
                <div class="queue-item-head">
                  <div>
                    <div class="queue-item-title">${esc(item.gameName)}</div>
                    <div class="queue-item-meta">
                      <span class="conv-fmt-badge">${(FMT_META[item.fmt] || FMT_META.cue).badge}</span>
                    </div>
                  </div>
                  <span class="queue-state ${item.status}">${state}</span>
                </div>
                <div class="queue-item-status">${esc(item.stageText || state)}</div>
                ${detail ? `<div class="queue-item-sub">${esc(detail)}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `);
  }

  qs('#queue-body').innerHTML = sections.length
    ? sections.join('')
    : `<div class="queue-empty">ROM conversions run here in the background so you can keep browsing and queue more games.</div>`;
}

function enqueueExtract(titleId, gameName, fmt) {
  const key = queueKey(titleId, fmt);
  const duplicate = Q.items.find(item =>
    item.key === key && (item.status === 'queued' || item.status === 'running')
  );
  if (duplicate) {
    toast('That conversion is already queued', '');
    openQueue();
    return;
  }

  Q.items.push({
    id: Q.nextId++,
    key,
    titleId,
    gameName,
    fmt,
    status: 'queued',
    stageText: 'Waiting in queue…',
    subText: '',
    stageTimer: null,
    filename: '',
    error: '',
  });

  renderQueue();
  toast(`Queued ${gameName}`, 'ok');
  void runNextQueuedExtract();
}

function startQueueStages(job) {
  const stages = STAGES[job.fmt] || STAGES.cue;
  let stageIdx = 0;
  job.stageText = stages[stageIdx];
  job.subText = 'Large disc conversions can take a few minutes the first time (cached after that)';
  // Tracks how long we've been on the LAST stage so we can append
  // "(still working… N s)" instead of letting the user think we're stuck.
  let lastStageEnteredAt = null;
  job.stageTimer = setInterval(() => {
    if (stageIdx < stages.length - 1) {
      stageIdx += 1;
      job.stageText = stages[stageIdx];
      if (stageIdx === stages.length - 1) lastStageEnteredAt = Date.now();
      renderQueue();
    } else if (lastStageEnteredAt != null) {
      // Once we've reached the final stage, every tick adds elapsed time
      // to the label so it's obvious the server is still working.  Stops
      // the user thinking the WebUI is stuck on "Writing CCI file…" when
      // really the converter is just slow on a Pi.
      const secs = Math.round((Date.now() - lastStageEnteredAt) / 1000);
      job.stageText = `${stages[stageIdx]} (server still working… ${secs}s)`;
      renderQueue();
    }
  }, 3200);
}

function stopQueueStages(job) {
  if (job?.stageTimer) {
    clearInterval(job.stageTimer);
    job.stageTimer = null;
  }
}

async function runNextQueuedExtract() {
  if (Q.activeId) return;

  const job = Q.items.find(item => item.status === 'queued');
  if (!job) {
    renderQueue();
    return;
  }

  Q.activeId = job.id;
  job.status = 'running';
  startQueueStages(job);
  renderQueue();

  _convAbort = new AbortController();

  try {
    // Two-phase strategy so multi-GB downloads don't OOM the browser:
    //
    //   Phase 1 — fetch() with the API key in a custom header so the server
    //             runs the conversion (or hits the cache) and returns the
    //             response headers including Content-Disposition. We DO NOT
    //             read the body — that's what was killing the WebUI on big
    //             3DS games (await r.blob() on a 3.5 GB CCI buffers the
    //             whole thing in browser memory and either OOMs the tab or
    //             stalls forever, depending on the platform).
    //
    //   Phase 2 — trigger an <a download href="…?api_key=…"> click. The
    //             browser handles the actual transfer with its native
    //             download manager: streams to disk, shows real progress,
    //             survives tab backgrounding, supports its own retry. The
    //             server side is a cache HIT (we just populated it during
    //             phase 1), so the conversion doesn't run twice.
    //
    // Net effect: same wall-clock time for the user, but reliability for
    // 1 GB+ downloads goes from "depends on phone RAM" to "browser
    // download manager handles it natively."
    const baseUrl = `/api/v1/roms/${encodeURIComponent(job.titleId)}?extract=${encodeURIComponent(job.fmt)}`;
    const r = await fetch(baseUrl, {
      headers: { 'X-API-Key': API_KEY },
      signal: _convAbort.signal,
    });

    if (!r.ok) {
      const txt = await r.text().catch(() => `HTTP ${r.status}`);
      throw new Error(txt || `HTTP ${r.status}`);
    }

    // Prefer the server's Content-Disposition filename so every client
    // (web, Android, Steam Deck, curl) lands on the same stem — important
    // for save-folder detection that keys off the filename.
    const filename = parseContentDispositionFilename(r.headers.get('Content-Disposition'))
                  || buildExtractFilename(job.titleId, job.gameName, job.fmt);

    // Phase-1 cleanup: explicitly cancel the in-flight body so the
    // browser stops buffering bytes we'll never read.  Without this the
    // network stack keeps draining the response in the background
    // (wasteful) until the GC eventually closes the Response.
    try { await r.body?.cancel(); } catch (_) { /* ignore */ }

    job.stageText = 'Streaming download to your device…';
    job.subText = 'Browser will save the file as it arrives';
    renderQueue();

    // Phase 2: hand off to the browser's native download manager.
    // The API key has to ride in the URL because <a href> can't carry
    // custom headers; the server's auth middleware accepts ?api_key=.
    const downloadUrl = `${baseUrl}&api_key=${encodeURIComponent(API_KEY)}`;
    const a = Object.assign(document.createElement('a'), {
      href: downloadUrl,
      download: filename,
    });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    job.filename = filename;
    job.status = 'done';
    job.stageText = 'Download started';
    job.subText = filename;
    toast(`⬇ ${filename}`, 'ok');
  } catch (e) {
    if (e.name === 'AbortError') {
      job.status = 'cancelled';
      job.stageText = 'Conversion cancelled';
      job.subText = '';
      toast('Conversion cancelled', '');
    } else {
      const meta = FMT_META[job.fmt] || FMT_META.cue;
      job.status = 'error';
      job.error = e.message;
      job.stageText = 'Conversion failed';
      job.subText = meta.errHint;
      toast('Conversion failed', 'err');
    }
  } finally {
    stopQueueStages(job);
    Q.activeId = null;
    _convAbort = null;
    trimQueueHistory();
    renderQueue();
    void runNextQueuedExtract();
  }
}

function cancelConvert(jobId) {
  const active = activeQueueItem();
  if (active && String(active.id) === String(jobId) && _convAbort) {
    _convAbort.abort();
  }
}

function removeQueuedJob(jobId) {
  Q.items = Q.items.filter(item => String(item.id) !== String(jobId) || item.status === 'running');
  trimQueueHistory();
  renderQueue();
}

function clearFinishedJobs() {
  Q.items = Q.items.filter(item => item.status === 'queued' || item.status === 'running');
  renderQueue();
}

// ═══════════════════════════════════════════════════════
//  LOAD — landing screen
//  Fetch the lightweight system overview + the saves list (saves total is
//  typically a few hundred, not thousands, so we can load it all). ROM rows
//  are not fetched until the user picks a system or searches: the 40k payload
//  never leaves the server during a cold load on mobile.
// ═══════════════════════════════════════════════════════
async function loadLanding() {
  showSkeletonTiles();
  try {
    const [ss, sd] = await Promise.all([
      api('/api/v1/roms/systems'),
      api('/api/v1/titles'),
    ]);
    S.stats         = ss.stats || {};
    S.saves         = sd.titles || [];
    S.savedTitleIds = new Set(S.saves.map(t => t.title_id));

    // Header tab counts
    const romTotal = Object.values(S.stats).reduce((n, v) => n + v, 0);
    qs('#cnt-roms').textContent  = num(romTotal);
    qs('#cnt-saves').textContent = num(S.saves.length);

    renderOverview();
    renderSaves();
  } catch(e) {
    qs('#roms-pane').innerHTML = emptyState('⚠️', 'Failed to load data', esc(e.message));
  }
}

// ═══════════════════════════════════════════════════════
//  NAV — sidebar + mobile chips
//  One link per system (ROMs tab) or platform (Saves tab); the entry being
//  viewed is highlighted.  `key` '' is the Saves tab's "All".
// ═══════════════════════════════════════════════════════
function navLink(action, key, count, active) {
  const name = key ? (lbl(key) === key ? '' : lbl(key)) : 'every platform';
  return `<div class="sys-link${active ? ' active' : ''}" data-action="${action}" data-sys="${esc(key)}" title="${esc(key ? lbl(key) : 'All platforms')}">
    <span class="sys-dot" style="background:${key ? clr(key) : 'var(--accent)'}"></span>
    <span class="sys-link-code">${esc(key || 'All')}</span>
    <span class="sys-link-name">${esc(name)}</span>
    <span class="sys-link-cnt">${num(count)}</span>
  </div>`;
}
function navChip(action, key, count, active) {
  return `<div class="sys-chip${active ? ' active' : ''}" data-action="${action}" data-sys="${esc(key)}">
    <span class="sys-chip-dot" style="background:${key ? clr(key) : 'var(--accent)'}"></span>
    ${esc(key || 'All')}
    <span class="sys-chip-cnt">${num(count)}</span>
  </div>`;
}

function renderSystemNav() {
  if (S.tab !== 'roms') return;
  const systems = Object.keys(S.stats).sort();
  qs('#sbl').textContent = 'Systems';
  qs('#sys-nav').innerHTML = systems.map(s =>
    navLink('nav-system', s, S.stats[s], s === S.currentSystem)).join('');
  qs('#sys-chips').innerHTML = systems.map(s =>
    navChip('nav-system', s, S.stats[s], s === S.currentSystem)).join('');
}

// ═══════════════════════════════════════════════════════
//  VIEW — overview (landing screen)
//  A grid of system tiles. Tiny DOM (~50 tiles), instant on mobile.
// ═══════════════════════════════════════════════════════
function renderOverview() {
  disposeLazy();
  S.view = 'overview';
  S.currentSystem = null;
  S.filters = { save: false, ra: false, patched: false };
  renderSystemNav();

  const systems = Object.keys(S.stats).sort();
  if (!systems.length) {
    qs('#roms-pane').innerHTML = emptyState('📭', 'No ROMs available',
      'Set SYNC_ROM_DIR to point to your ROM library, then rescan from Settings.');
    return;
  }

  const total = systems.reduce((n, s) => n + S.stats[s], 0);
  let h = sumStrip([[num(total), 'ROMs'], [systems.length, 'systems'], [num(S.saves.length), 'saves']]);
  h += '<div class="sys-grid">';
  for (const sys of systems) {
    h += `<div class="sys-tile" data-action="nav-system" data-sys="${esc(sys)}" title="${esc(lbl(sys))}">
      <div class="sys-tile-stripe" style="background:${clr(sys)}"></div>
      <div class="sys-tile-top">
        <span class="sys-tile-code">${esc(sys)}</span>
        <span class="sys-tile-cnt">${num(S.stats[sys])}</span>
      </div>
      <div class="sys-tile-name">${esc(lbl(sys))}</div>
    </div>`;
  }
  h += '</div>';
  qs('#roms-pane').innerHTML = h;
  syncHdrHeight();
}

// ═══════════════════════════════════════════════════════
//  ROM DISPLAY NAME — the variant has to survive
//  The catalog's `name` is the DAT's canonical name for the game: right for
//  an arcade set (`005.zip` -> "005"), wrong the moment two files are the
//  same game.  A translation, a hack, disc 2 and a later revision all carry
//  the canonical name of the disc they were matched to, so listing by `name`
//  shows "Bulk Slash (Japan)" twice and disc 2 as "(Disc 1)".  What tells
//  them apart is in the FILE name, so a No-Intro/Redump-style file name
//  (anything with a `(...)` or `[...]` group) is what gets shown, split into
//  a title and its tags; the canonical name is kept as an "aka" when the
//  title itself differs (a translated title, say).  A bare file name with no
//  groups (MAME short names) falls back to the canonical name.
// ═══════════════════════════════════════════════════════
const ARCHIVE_EXT = /\.(zip|7z|rar)$/i;
const INNER_EXT   = /\.(3ds|cci|cia|nds|iso|xiso|wud|wux|rvz|wbfs)$/i;
const KIND_LBL    = { msu1: 'MSU-1', 'msu-md': 'MSU-MD', mdplus: 'MD+' };

function fileStem(filename) {
  let s = filename || '';
  if (ARCHIVE_EXT.test(s)) return s.replace(ARCHIVE_EXT, '').replace(INNER_EXT, '');
  return s.replace(/\.[A-Za-z0-9]{1,5}$/, '');
}

function tagClass(text, bracket) {
  if (bracket) {
    if (/^(T[-+]|Translat)/i.test(text)) return 'tr';
    if (text.length <= 2) return 'flag';          // [!] [n] [i] …
    return 'hack';
  }
  if (/^Dis[ck] ?\d/i.test(text)) return 'disc';
  if (/^(Rev\b|v\d|Beta|Proto|Demo|Sample|Unl\b|Pirate|Aftermarket|Homebrew|Alt\b)/i.test(text)) return 'rev';
  return '';
}

// "Bulk Slash (Japan) [T-En by X] [Undub]" -> title "Bulk Slash",
// tags [(Japan), [T-En by X], [Undub]].
function splitName(s) {
  const tags = [];
  const title = (s || '').replace(/\(([^()]*)\)|\[([^\[\]]*)\]/g, (m, paren, bracket) => {
    const bk = bracket !== undefined;
    const text = (bk ? bracket : paren).trim();
    if (text) tags.push({ text, cls: tagClass(text, bk) });
    return ' ';
  }).replace(/\s+/g, ' ').trim();
  return title ? { title, tags } : { title: s || '', tags: [] };
}

const looseKey = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

// Work out once, at fetch time, how a ROM is shown and sorted.
function prepRom(rom) {
  const stem = fileStem(rom.filename);
  const fromFile = /[(\[]/.test(stem);
  const full = fromFile ? stem : (rom.name || stem || rom.rom_id || rom.title_id || '');
  const { title, tags } = splitName(full);

  let aka = '';
  if (fromFile && rom.name) {
    const canon = splitName(rom.name).title;
    if (canon && looseKey(canon) !== looseKey(title)) aka = canon;
  }
  if (rom.bundle_kind && KIND_LBL[rom.bundle_kind]) {
    // A pack usually says "(MSU1)" in its name already: colour that tag
    // rather than adding a second one.
    const kind = KIND_LBL[rom.bundle_kind];
    const own = tags.find(t => looseKey(t.text) === looseKey(kind));
    if (own) own.cls = 'kind';
    else tags.push({ text: kind, cls: 'kind' });
  }
  if (rom.content_type && !/^(game|base)$/i.test(rom.content_type)) {
    tags.push({ text: String(rom.content_type).toUpperCase(), cls: 'kind' });
  }
  rom._d = {
    full, title, tags, aka,
    patched: tags.some(t => t.cls === 'tr' || t.cls === 'hack'),
  };
  return rom;
}

const hasSave = rom => S.savedTitleIds.has(rom.title_id);
const hasRa   = rom => !!(rom.ra_game_id && rom.ra_achievements);

function tagsHtml(rom) {
  const d = rom._d;
  if (!d.tags.length) return '';
  return `<span class="tags">${d.tags.map(t =>
    `<span class="tag ${t.cls}" title="${esc(t.text)}">${esc(t.text)}</span>`).join('')}</span>`;
}
function akaHtml(rom) {
  const a = rom._d.aka;
  return a ? `<span class="aka" title="Catalog name: ${esc(rom.name)}">aka ${esc(a)}</span>` : '';
}
// RetroAchievements badge. A title match means the set exists for the game
// but this exact file's hash is not one RA lists — common for patched ROMs.
function raHtml(rom) {
  if (!hasRa(rom)) return '';
  const weak = rom.ra_match !== 'hash';
  const tip = `RetroAchievements: ${rom.ra_title || rom._d.title} — ${rom.ra_achievements} achievements`
            + (weak ? ' (matched by title; this file’s hash is not listed)' : '');
  return `<a class="ra${weak ? ' weak' : ''}" target="_blank" rel="noopener"
    href="https://retroachievements.org/game/${encodeURIComponent(rom.ra_game_id)}"
    title="${esc(tip)}">🏆 ${esc(rom.ra_achievements)}</a>`;
}

// ═══════════════════════════════════════════════════════
//  VIEW — single system (lazy-rendered)
//  Fetches all ROMs for ONE system (typically hundreds to a few thousand),
//  then streams rows into the DOM in LAZY_BATCH chunks via IntersectionObserver.
// ═══════════════════════════════════════════════════════
async function openSystem(sys) {
  sys = (sys || '').toUpperCase();
  if (!sys) return;

  disposeLazy();
  S.view = 'system';
  S.currentSystem = sys;
  renderSystemNav();

  // Jump to top so the context bar is visible after drill-down.
  window.scrollTo({ top: 0 });

  if (!S.systemCache[sys]) {
    qs('#roms-pane').innerHTML = skeletonSystem(sys);
    try {
      const d = await api(`/api/v1/roms?system=${encodeURIComponent(sys)}`);
      const roms = (d.roms || []).map(prepRom);
      sortByName(roms);
      S.systemCache[sys] = roms;
    } catch(e) {
      if (S.view === 'system' && S.currentSystem === sys) {
        qs('#roms-pane').innerHTML = emptyState('⚠️', 'Failed to load ' + esc(sys), esc(e.message));
      }
      return;
    }
    // The user may have moved on while the fetch was in flight.
    if (S.view !== 'system' || S.currentSystem !== sys) return;
  }
  renderRomView();
}

// ═══════════════════════════════════════════════════════
//  VIEW — search (server-side, cross-system)
//  Capped at SEARCH_CAP for sanity. The server matches the catalog name and
//  the file name, so a search for a translator or "disc 2" finds the file.
// ═══════════════════════════════════════════════════════
async function runSearch(q) {
  disposeLazy();
  S.view = 'search';
  S.currentSystem = null;
  renderSystemNav();

  // Cancel in-flight search if the user kept typing.
  if (S.searchAbort) S.searchAbort.abort();
  const abort = S.searchAbort = new AbortController();

  qs('#roms-pane').innerHTML = emptyState('🔍', `Searching "${esc(q)}"…`, '');

  let data;
  try {
    const r = await fetch(
      `/api/v1/roms?search=${encodeURIComponent(q)}&limit=${SEARCH_CAP}`,
      { headers: { 'X-API-Key': API_KEY }, signal: abort.signal }
    );
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
  } catch(e) {
    if (e.name === 'AbortError') return;  // superseded by a newer search
    qs('#roms-pane').innerHTML = emptyState('⚠️', 'Search failed', esc(e.message));
    return;
  } finally {
    if (S.searchAbort === abort) S.searchAbort = null;
  }
  if (S.view !== 'search') return;

  const roms = (data.roms || []).map(prepRom);
  sortByName(roms);
  S.searchResults = { q, total: data.total, roms };
  renderRomView();
}

// ═══════════════════════════════════════════════════════
//  ROM VIEW — draws the current system or search from what is already
//  fetched.  Filters and the list/grid toggle land here, so neither costs
//  a request.
// ═══════════════════════════════════════════════════════
function applyFilters(roms) {
  const f = S.filters;
  if (!f.save && !f.ra && !f.patched) return roms;
  return roms.filter(r =>
    (!f.save || hasSave(r)) && (!f.ra || hasRa(r)) && (!f.patched || r._d.patched));
}

function renderRomView() {
  disposeLazy();
  let all, head, none;
  if (S.view === 'system' && S.currentSystem) {
    all  = S.systemCache[S.currentSystem] || [];
    none = ['No ROMs in ' + esc(S.currentSystem), 'The catalog has no entries for this system.'];
  } else if (S.view === 'search' && S.searchResults) {
    all  = S.searchResults.roms;
    none = [`No ROMs match "${esc(S.searchResults.q)}"`, 'Try a different search term.'];
  } else {
    return;
  }
  const roms = applyFilters(all);
  head = S.view === 'system' ? contextBar(S.currentSystem, all, roms)
                             : searchBar(S.searchResults, all, roms);

  if (!roms.length) {
    const msg = all.length ? ['Nothing matches these filters', 'Turn a filter off to see more.'] : none;
    qs('#roms-pane').innerHTML = head + emptyState('📭', msg[0], msg[1]);
    syncHdrHeight();
    return;
  }

  qs('#roms-pane').innerHTML = head +
    `<div class="${gridClass()}" id="lazy-grid"></div>
     <div class="load-more" id="lazy-sentinel">Loading more…</div>`;
  startLazy(roms, 'lazy-grid', 'lazy-sentinel', rowOrCard());
  syncHdrHeight();
}

// ═══════════════════════════════════════════════════════
//  LAZY RENDERER
//  Appends rows in LAZY_BATCH chunks. An IntersectionObserver watches the
//  sentinel at the bottom of the list — when it enters the viewport, we
//  render the next chunk. This keeps initial render cost constant no matter
//  how many ROMs the system contains.
// ═══════════════════════════════════════════════════════
function startLazy(items, containerId, sentinelId, renderFn) {
  S.lazy.items = items;
  S.lazy.rendered = 0;
  S.lazy.containerId = containerId;
  S.lazy.renderFn = renderFn;

  renderNextBatch();

  const sentinel = document.getElementById(sentinelId);
  if (!sentinel) return;
  S.lazy.observer = new IntersectionObserver(entries => {
    if (entries.some(e => e.isIntersecting)) renderNextBatch();
  }, { rootMargin: '600px 0px' });  // start rendering before sentinel is actually visible
  S.lazy.observer.observe(sentinel);
}

function renderNextBatch() {
  const { items, rendered, containerId, renderFn } = S.lazy;
  const container = document.getElementById(containerId);
  if (!container) return;

  const end = Math.min(rendered + LAZY_BATCH, items.length);
  if (end <= rendered) return;

  // Build a DocumentFragment once, then append — single reflow per batch.
  const tmp = document.createElement('div');
  let h = '';
  for (let i = rendered; i < end; i++) h += renderFn(items[i]);
  tmp.innerHTML = h;
  const frag = document.createDocumentFragment();
  while (tmp.firstChild) frag.appendChild(tmp.firstChild);
  container.appendChild(frag);

  S.lazy.rendered = end;

  if (end >= items.length) {
    const s = document.getElementById('lazy-sentinel');
    if (s) s.classList.add('hidden');
    if (S.lazy.observer) { S.lazy.observer.disconnect(); S.lazy.observer = null; }
  }
}

function disposeLazy() {
  if (S.lazy.observer) { S.lazy.observer.disconnect(); S.lazy.observer = null; }
  S.lazy.items = [];
  S.lazy.rendered = 0;
  S.lazy.containerId = null;
  S.lazy.renderFn = null;
}

// ═══════════════════════════════════════════════════════
//  ROM ACTIONS — download / convert buttons
// ═══════════════════════════════════════════════════════
// Every extract format the server can advertise, with the button label and
// tooltip the WebUI shows for it.  Driving the buttons off this table instead
// of a chain of per-system `if` branches is deliberate: the old chain only
// matched a handful of exact format combinations, so anything else — PS1's
// ['cue','eboot','psio','vcd'], a PS1 folder bundle's ['psio'], Wii U's
// ['loadiine','wua'] — silently fell through to a bare "↓" and the
// conversions became unreachable from the web UI.
const EXTRACT_BTN = {
  cue:           { label: 'CUE/BIN',  tip: 'Convert to CUE/BIN ZIP' },
  gdi:           { label: 'GDI',      tip: 'Convert to GDI (Dreamcast) ZIP' },
  iso:           { label: 'ISO',      tip: 'Convert to ISO' },
  cso:           { label: 'CSO',      tip: 'Convert and compress to CSO' },
  eboot:         { label: 'EBOOT',    tip: 'Convert to PSP EBOOT.PBP (PSP / Adrenaline)' },
  vcd:           { label: 'VCD',      tip: 'Convert to POPStarter VCD (OPL on PS2)' },
  psio:          { label: 'PSIO',     tip: 'Convert to PSIO BIN/CU2 ZIP' },
  cia:           { label: 'CIA',      tip: 'Convert to decrypted CIA (installable on CFW 3DS, works in emulators)' },
  decrypted_cci: { label: 'CCI',      tip: 'Convert to decrypted CCI (for emulators)' },
  cci:           { label: 'CCI',      tip: 'Download or convert to CCI ZIP' },
  folder:        { label: 'FOLDER',   tip: 'Extract disc files and download as ZIP' },
  loadiine:      { label: 'LOADIINE', tip: 'Decrypt to a code/content/meta folder ZIP' },
  wua:           { label: 'WUA',      tip: 'Convert to a Cemu .wua archive' },
};

// Label for the "download what's on disk" button.  Bundles are folders, so
// their filename has no usable extension — call those ZIP, which is what the
// server actually sends.
function rawDownloadLabel(rom) {
  const name = rom.filename || '';
  const dot = name.lastIndexOf('.');
  const ext = dot > 0 ? name.slice(dot + 1) : '';
  if (ext && ext.length <= 5) return ext.toUpperCase();
  return rom.is_bundle ? 'ZIP' : 'ROM';
}

// Build the button group for a ROM: conversions, the file as it sits on
// disk, and a share link.  Shared by the row and card renderers.
function romActions(rom) {
  const sys  = rom.system || 'UNKNOWN';
  const c    = clr(sys);
  // Always prefer rom_id over title_id for routing/extract: title_id
  // collides for multi-variant entries (Saturn ROM hacks sharing a product
  // code, multi-disc games after disc-index stripping, etc.). rom_id is
  // catalog-unique. Fall back to title_id for any old payload missing
  // rom_id.
  const dlId = rom.rom_id || rom.title_id;
  const tid  = esc(dlId);
  const fn   = esc(rom.filename || dlId);
  const fmt  = rom.extract_format;
  const extractFormats = Array.isArray(rom.extract_formats) ? rom.extract_formats : [];
  const rawUrl = `/api/v1/roms/${encodeURIComponent(dlId)}`;
  const rawLabel = rawDownloadLabel(rom);
  // What the queue calls the job: the file's own name, so two variants of
  // one game stay distinguishable there too.
  const name = esc(rom._d.full);

  // Unknown formats are dropped rather than rendered blank — this page can be
  // older than the server it talks to.
  const opts = extractFormats
    .map(f => ({ fmt: f, meta: EXTRACT_BTN[f] }))
    .filter(o => o.meta);

  const buttons = opts.map(o => {
    // RVZ sources advertise 'iso', but ?extract=rvz is the form the queue
    // UI has a DolphinTool-specific error hint for.  Both reach the same
    // handler server-side.
    const reqFmt = (o.fmt === 'iso' && fmt === 'rvz') ? 'rvz' : o.fmt;
    return `<button class="dl-btn extract" data-action="extract"
      data-tid="${tid}" data-name="${name}" data-fmt="${esc(reqFmt)}"
      title="${esc(o.meta.tip)}">${o.meta.label}</button>`;
  });
  // Skip the raw button when a conversion button already wears the same
  // label — an Xbox .cci offering ?extract=cci would otherwise show two
  // "CCI" buttons that do different things.
  if (!opts.some(o => o.meta.label === rawLabel)) {
    buttons.push(`<button class="dl-btn" data-action="dl"
      data-url="${rawUrl}" data-fn="${fn}"
      title="Download ${fn}">↓ ${rawLabel}</button>`);
  }
  // The share link only ever points at the raw download: ?extract= routes
  // aren't stable shareable URLs (job-cached, streamed, slow).
  buttons.push(`<button class="dl-btn copy" data-action="copy" data-url="${rawUrl}"
    title="Copy share link to the original ${rawLabel}" aria-label="Copy share link">🔗</button>`);

  return { btnHtml: `<div class="rom-btns">${buttons.join('')}</div>`, c, sys };
}

// Size, with the member count for a folder-shaped entry in the tooltip.
function sizeTip(rom) {
  const n = rom.is_bundle && rom.file_count ? ` in ${rom.file_count} files` : '';
  return esc(`${rom.filename || ''} — ${fmtB(rom.size) || 'unknown size'}${n}`);
}

// ═══════════════════════════════════════════════════════
//  ROM ROW — dense list layout (the default)
// ═══════════════════════════════════════════════════════
function romRowHtml(rom) {
  const { btnHtml, c, sys } = romActions(rom);
  const sysBadge = S.view === 'search'
    ? `<span class="badge" style="background:${c}">${esc(sys)}</span>` : '';
  return `<div class="rom-row">
    <div class="row-stripe" style="background:${c}"></div>
    <div class="row-main">
      ${sysBadge}
      <span class="rt" title="${esc(rom.filename)}">${esc(rom._d.title)}</span>
      ${tagsHtml(rom)}
      ${akaHtml(rom)}
    </div>
    <span class="row-ra">${raHtml(rom)}</span>
    <span class="row-save">${hasSave(rom) ? `<span class="save-dot" title="A save for this game is on the server">save</span>` : ''}</span>
    <span class="row-size" title="${sizeTip(rom)}">${fmtB(rom.size)}</span>
    ${btnHtml}
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  ROM CARD — grid layout
// ═══════════════════════════════════════════════════════
function romCardHtml(rom) {
  const { btnHtml, c, sys } = romActions(rom);
  const sysBadge = S.view === 'search'
    ? `<span class="badge" style="background:${c}">${esc(sys)}</span>` : '';
  return `<div class="rom-card">
    <div class="rom-stripe" style="background:${c}"></div>
    <div class="rom-body">
      <div class="rom-title" title="${esc(rom.filename)}">${esc(rom._d.title)}</div>
      ${tagsHtml(rom)}
      ${akaHtml(rom)}
      <div class="rom-meta">
        ${sysBadge}
        <span class="rom-size" title="${sizeTip(rom)}">${fmtB(rom.size)}</span>
        ${raHtml(rom)}
        ${hasSave(rom) ? `<span class="save-dot">save</span>` : ''}
      </div>
    </div>
    <div class="rom-foot">${btnHtml}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  CONTEXT BAR — back button, what is shown, filters, layout toggle
// ═══════════════════════════════════════════════════════
function shownOf(all, shown) {
  return shown.length === all.length ? num(all.length) : `${num(shown.length)} of ${num(all.length)}`;
}

function contextBar(sys, all, shown) {
  const size = all.reduce((n, r) => n + (r.size || 0), 0);
  return `<div class="view-head">
    <div class="ctx-bar">
      <button class="back-btn" data-action="nav-overview" title="Back to systems">← Systems</button>
      <span class="badge" style="background:${clr(sys)}">${esc(sys)}</span>
      <h2>${esc(lbl(sys))}</h2>
      <span class="ctx-count">${shownOf(all, shown)} ROMs${size ? ' · ' + fmtB(size) : ''}</span>
      ${filterHtml(all)}
      ${viewToggleHtml()}
    </div>
    ${alphaBarHtml(shown)}
  </div>`;
}

function searchBar(res, all, shown) {
  const capped = res.total > all.length
    ? ` · first ${num(all.length)} of ${num(res.total)} — narrow the search for the rest` : '';
  return `<div class="view-head">
    <div class="ctx-bar">
      <button class="back-btn" data-action="nav-overview" title="Clear search">← Systems</button>
      <h2>Search: "${esc(res.q)}"</h2>
      <span class="ctx-count">${shownOf(all, shown)} match${all.length === 1 ? '' : 'es'}${capped}</span>
      ${filterHtml(all)}
      ${viewToggleHtml()}
    </div>
    ${alphaBarHtml(shown)}
  </div>`;
}

function skeletonBar(sys) {
  return `<div class="view-head">
    <div class="ctx-bar">
      <button class="back-btn" data-action="nav-overview" title="Back to systems">← Systems</button>
      <span class="badge" style="background:${clr(sys)}">${esc(sys)}</span>
      <h2>${esc(lbl(sys))}</h2>
      <span class="ctx-count">loading…</span>
    </div>
    ${alphaBarHtml([])}
  </div>`;
}

// Filter pills, each with how many of this view's ROMs it would keep. A
// pill with nothing behind it is left out (unless it is switched on).
function filterHtml(all) {
  const n = { save: 0, ra: 0, patched: 0 };
  for (const r of all) {
    if (hasSave(r))   n.save++;
    if (hasRa(r))     n.ra++;
    if (r._d.patched) n.patched++;
  }
  const pill = (key, label, tip) => (n[key] || S.filters[key])
    ? `<button class="flt${S.filters[key] ? ' active' : ''}" data-action="filter" data-key="${key}"
         title="${tip}">${label}<span>${num(n[key])}</span></button>`
    : '';
  return `<div class="flts">
    ${pill('save', 'Has save', 'Only games with a save on the server')}
    ${pill('ra', '🏆 Achievements', 'Only games with a RetroAchievements set')}
    ${pill('patched', 'Translations &amp; hacks', 'Only fan translations and ROM hacks')}
  </div>`;
}

// List/grid toggle. Reflects S.layout; persisted in setLayout().
function viewToggleHtml() {
  const g = S.layout === 'grid', l = !g;
  return `<div class="view-toggle">
    <button class="vt-btn${l ? ' active' : ''}" data-action="layout" data-layout="list" title="List view" aria-label="List view">☰</button>
    <button class="vt-btn${g ? ' active' : ''}" data-action="layout" data-layout="grid" title="Grid view" aria-label="Grid view">▦</button>
  </div>`;
}

// First sort key of a name: A-Z, or '#' for anything starting non-alpha.
function firstLetter(name) {
  const ch = (name || '').trim().charAt(0).toUpperCase();
  return (ch >= 'A' && ch <= 'Z') ? ch : '#';
}

// A-Z (+#) quick-jump strip. Letters with no matching ROM are disabled.
function alphaBarHtml(items) {
  const present = new Set((items || []).map(it => firstLetter(it._d.full)));
  const letters = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
  const btns = letters.map(L => {
    const on = present.has(L);
    return on
      ? `<button class="alpha-btn" data-action="alpha" data-letter="${L}">${L}</button>`
      : `<button class="alpha-btn off" disabled>${L}</button>`;
  }).join('');
  return `<div class="alpha-bar">${btns}</div>`;
}

const gridClass = () => S.layout === 'grid' ? 'card-grid' : 'rom-list';
const rowOrCard = () => S.layout === 'grid' ? romCardHtml : romRowHtml;

// By the name that is shown, so the list reads in order and the alphabet
// strip lands where it says.
function sortByName(arr) {
  const cmp = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare;
  arr.sort((a, b) => cmp(a._d.full, b._d.full));
}

// Switch list/grid. Persists and re-renders the current ROM view.
function setLayout(layout) {
  if (layout !== 'grid' && layout !== 'list') return;
  if (layout === S.layout) return;
  S.layout = layout;
  try { localStorage.setItem('gamesync_layout', layout); } catch (_) { /* private mode */ }
  renderRomView();
}

// Scroll to the first ROM whose name starts with `letter`. Because rows are
// lazy-rendered, render forward until the target index exists, then scroll to
// it (DOM child index === item index, nothing else lives in the container).
function jumpToLetter(letter) {
  const items = S.lazy.items;
  const idx = items.findIndex(it => firstLetter(it._d.full) === letter);
  if (idx < 0) return;
  let guard = 0;
  while (S.lazy.rendered <= idx && guard++ < 1000) renderNextBatch();
  const container = document.getElementById(S.lazy.containerId);
  const el = container && container.children[idx];
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ═══════════════════════════════════════════════════════
//  RENDER — Saves
//  One flat, sortable table (newest sync first by default); the sidebar
//  narrows it to a platform.  The whole list is on the client already.
// ═══════════════════════════════════════════════════════
const saveName = sv => sv.game_name || sv.name || sv.title_id || '';
const savePlat = sv => sv.console_type || sv.platform || 'UNKNOWN';
const saveTime = sv => Date.parse(sv.last_sync || sv.server_timestamp || '') || 0;

const SAVE_SORT = {
  name:  { get: sv => saveName(sv).toLowerCase(), dir:  1 },
  plat:  { get: savePlat,                         dir:  1 },
  date:  { get: saveTime,                         dir: -1 },
  size:  { get: sv => sv.save_size || 0,          dir: -1 },
  files: { get: sv => sv.file_count || 0,         dir: -1 },
};

function setSaveSort(key) {
  if (!SAVE_SORT[key]) return;
  if (S.saveSort.key === key) S.saveSort.dir = -S.saveSort.dir;
  else S.saveSort = { key, dir: SAVE_SORT[key].dir };
  renderSaves();
}

function renderSaves() {
  const q = S.q;
  const matched = S.saves.filter(sv =>
    !q || saveName(sv).toLowerCase().includes(q) || (sv.title_id || '').toLowerCase().includes(q));

  const counts = {};
  for (const sv of matched) counts[savePlat(sv)] = (counts[savePlat(sv)] || 0) + 1;
  const plats = Object.keys(counts).sort();
  if (S.savePlat && !counts[S.savePlat]) S.savePlat = null;

  if (S.tab === 'saves') {
    qs('#sbl').textContent = 'Platforms';
    qs('#sys-nav').innerHTML =
      navLink('save-plat', '', matched.length, !S.savePlat) +
      plats.map(p => navLink('save-plat', p, counts[p], p === S.savePlat)).join('');
    qs('#sys-chips').innerHTML =
      navChip('save-plat', '', matched.length, !S.savePlat) +
      plats.map(p => navChip('save-plat', p, counts[p], p === S.savePlat)).join('');
  }

  const rows = S.savePlat ? matched.filter(sv => savePlat(sv) === S.savePlat) : matched.slice();
  if (!rows.length) {
    qs('#saves-pane').innerHTML = emptyState('💾',
      q ? `No saves match "${esc(q)}"` : 'No saves on server yet',
      q ? 'Try a different search term.' : 'Upload a save from your device to see it here.');
    return;
  }

  const { key, dir } = S.saveSort;
  const get = SAVE_SORT[key].get;
  rows.sort((a, b) => {
    const x = get(a), y = get(b);
    if (x < y) return -dir;
    if (x > y) return dir;
    return saveName(a).localeCompare(saveName(b));
  });

  const bytes = rows.reduce((n, sv) => n + (sv.save_size || 0), 0);
  const th = (k, label, cls = '') =>
    `<th class="${cls}${key === k ? ' sorted' : ''}" data-action="save-sort" data-key="${k}"
       title="Sort by ${label.toLowerCase()}">${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;

  let h = sumStrip([
    [num(rows.length), S.savePlat ? esc(lbl(S.savePlat)) + ' saves' : 'saves'],
    ...(S.savePlat ? [] : [[plats.length, 'platforms']]),
    [fmtB(bytes) || '0 B', 'stored'],
  ]);
  h += `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      ${th('name', 'Game')}
      <th class="c-id">Save ID</th>
      ${th('plat', 'Platform')}
      ${th('date', 'Last sync')}
      <th class="c-src">From</th>
      ${th('size', 'Size', 'num c-size')}
      ${th('files', 'Files', 'num c-files')}
      <th class="c-hash">Hash</th>
      <th></th>
    </tr></thead><tbody>`;

  for (const sv of rows) {
    const nm   = saveName(sv);
    const plat = savePlat(sv);
    const fn   = esc(sv.title_id + '.bin');
    const url  = esc(`/api/v1/saves/${encodeURIComponent(sv.title_id)}`);
    // A save the server could not name shows its id once, not twice.
    const named = nm && nm !== sv.title_id;
    const hash  = sv.save_hash || '';
    h += `<tr>
      <td>${named ? `<span class="save-game">${esc(nm)}</span>` : `<span class="save-id">${esc(sv.title_id)}</span>`}</td>
      <td class="c-id"><div class="save-id" title="${esc(sv.title_id)}">${named ? esc(sv.title_id) : ''}</div></td>
      <td><span class="badge" style="background:${clr(plat)}">${esc(plat)}</span></td>
      <td><span class="save-date">${fmtD(sv.last_sync || sv.server_timestamp)}</span></td>
      <td class="c-src"><span class="save-size">${esc(sv.last_sync_source || '—')}</span></td>
      <td class="num c-size"><span class="save-size">${fmtB(sv.save_size) || '—'}</span></td>
      <td class="num c-files"><span class="save-size">${sv.file_count ?? '—'}</span></td>
      <td class="c-hash"><span class="save-hash" title="${esc(hash)}">${esc(hash.slice(0, 10))}</span></td>
      <td class="save-act">
        <button class="dl-btn" data-action="dl" data-url="${url}" data-fn="${fn}" title="Download this save">↓</button>
        <button class="dl-btn copy" data-action="copy" data-url="${url}" title="Copy share link">🔗</button>
      </td>
    </tr>`;
  }
  h += `</tbody></table></div>`;
  qs('#saves-pane').innerHTML = h;
}

// ═══════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════
function switchTab(tab) {
  S.tab = tab;
  qs('#roms-pane').style.display  = tab === 'roms'  ? '' : 'none';
  qs('#saves-pane').style.display = tab === 'saves' ? '' : 'none';
  qs('#tab-roms').className  = 'tab-btn' + (tab === 'roms'  ? ' active' : '');
  qs('#tab-saves').className = 'tab-btn' + (tab === 'saves' ? ' active' : '');
  qs('#search').placeholder = tab === 'saves' ? 'Search saves…' : 'Search games…';
  window.scrollTo({ top: 0 });

  if (tab === 'saves') {
    renderSaves();              // also rebuilds the nav from the platforms
  } else {
    renderSystemNav();
    // Whatever is in the search box applies to the tab being shown.
    const q = qs('#search').value.trim();
    if (q)                                              runSearch(q);
    else if (S.view === 'system' && S.currentSystem)    renderRomView();
    else                                                renderOverview();
  }
  syncHdrHeight();
}

// ═══════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════
function openCfg()  { if (IS_ADMIN) qs('#cfg-modal').classList.remove('hidden'); }
function closeCfg() { qs('#cfg-modal').classList.add('hidden'); }

async function scanRoms(btn) {
  btn.disabled = true; btn.textContent = '⏳ Scanning…';
  try {
    const d = await api('/api/v1/roms/scan');
    toast(`Scan complete — ${d.count} ROMs found`, 'ok');
    closeCfg();
    // Invalidate per-system caches — a rescan may have added/removed ROMs.
    S.systemCache = {};
    S.searchResults = null;
    qs('#search').value = ''; S.q = '';
    loadLanding();
  } catch(e) { toast('Scan failed: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '🔄 Rescan ROM directory'; }
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
const qs  = sel => document.querySelector(sel);
const num = n => Number(n || 0).toLocaleString();

// [[value, label], …] -> the one-line summary above a view.
function sumStrip(pairs) {
  return `<div class="sum">${pairs.map(([v, l]) => `<span><b>${v}</b>${l}</span>`).join('')}</div>`;
}
function emptyState(icon, title, sub) {
  return `<div class="empty">
    <div class="empty-icon">${icon}</div>
    <div class="empty-title">${title}</div>
    <div class="empty-sub">${sub}</div>
  </div>`;
}
function fmtB(b) {
  if (!b) return '';
  if (b < 1024)       return b + ' B';
  if (b < 1048576)    return (b / 1024).toFixed(0) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  if (b < 1099511627776) return (b / 1073741824).toFixed(2) + ' GB';
  return (b / 1099511627776).toFixed(2) + ' TB';
}
function fmtD(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString(undefined,
    { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _tt;
function toast(msg, type='') {
  const el = qs('#toast');
  el.textContent = msg; el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_tt); _tt = setTimeout(() => { el.className = ''; }, 3400);
}
// Tile-shaped skeleton for the landing (system picker) screen.
function showSkeletonTiles() {
  const t = Array.from({length:24}, () =>
    `<div class="sys-tile skeleton" style="height:52px"></div>`
  ).join('');
  qs('#roms-pane').innerHTML = `<div class="sys-grid">${t}</div>`;
}
// Row-shaped skeleton inside a system view while its fetch is in flight.
function skeletonSystem(sys) {
  const rows = Array.from({length:18}, () => `<div class="skel-row skeleton"></div>`).join('');
  return skeletonBar(sys) + `<div class="rom-list">${rows}</div>`;
}

// ── EVENT DELEGATION ─────────────────────────────────────
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const { action, url, fn, tid, name, fmt, sys, key } = btn.dataset;
  if (action === 'dl')           dlFile(url, fn, btn);
  if (action === 'copy')         copyLink(url, btn);
  if (action === 'extract')      enqueueExtract(tid, name, fmt);
  if (action === 'nav-system')   { qs('#search').value = ''; S.q = ''; openSystem(sys); }
  if (action === 'nav-overview') { qs('#search').value = ''; S.q = ''; renderOverview(); window.scrollTo({ top: 0 }); }
  if (action === 'layout')       setLayout(btn.dataset.layout);
  if (action === 'alpha')        jumpToLetter(btn.dataset.letter);
  if (action === 'filter')       { S.filters[key] = !S.filters[key]; renderRomView(); }
  if (action === 'save-plat')    { S.savePlat = sys || null; renderSaves(); window.scrollTo({ top: 0 }); }
  if (action === 'save-sort')    setSaveSort(key);
});

// ── QUEUE ACTIONS / OUTSIDE CLOSE ────────────────────────
document.addEventListener('click', e => {
  const actionBtn = e.target.closest('[data-qaction]');
  if (actionBtn) {
    const { qaction, jobId } = actionBtn.dataset;
    if (qaction === 'cancel') cancelConvert(jobId);
    if (qaction === 'remove') removeQueuedJob(jobId);
    if (qaction === 'clear-done') clearFinishedJobs();
  }

  if (e.target.id === 'cfg-modal') closeCfg();

  const panel = qs('#queue-panel');
  const queueBtn = qs('#queue-btn');
  if (!panel.classList.contains('hidden') && !panel.contains(e.target) && !queueBtn.contains(e.target)) {
    closeQueue();
  }
});

// ── PINNED HEIGHTS → CSS VARS ────────────────────────────
// The header wraps on a phone, the chip bar only exists on mobile and the
// view header grows when its pills wrap, so everything that sticks below
// them is positioned from measurements rather than guesses.
function syncHdrHeight() {
  const root = document.documentElement.style;
  const h = document.querySelector('header').getBoundingClientRect().height;
  root.setProperty('--hdr-h', h + 'px');
  const chips = document.getElementById('sys-chips');
  const ch = (chips && getComputedStyle(chips).display !== 'none')
    ? chips.getBoundingClientRect().height : 0;
  root.setProperty('--chips-h', ch + 'px');
  const vh = document.querySelector('.view-head');
  root.setProperty('--vh-h', (vh ? vh.getBoundingClientRect().height : 0) + 'px');
}

// ── SEARCH ───────────────────────────────────────────────
// ROMs tab: hit the server with ?search= (capped at SEARCH_CAP).
// Saves tab: stays client-side (the full saves list is small).
// 240ms debounce is a good sweet spot on mobile — responsive without firing
// a request per keystroke. AbortController inside runSearch() cancels any
// in-flight request when a newer one supersedes it.
let _st;
function handleSearchInput(raw) {
  const q = (raw || '').trim();
  S.q = q.toLowerCase();
  if (S.tab === 'saves') {
    renderSaves();
    return;
  }
  // ROMs tab.
  if (!q) {
    if (S.searchAbort) { S.searchAbort.abort(); S.searchAbort = null; }
    renderOverview();
    return;
  }
  runSearch(q);
}

document.addEventListener('DOMContentLoaded', () => {
  syncHdrHeight();
  window.addEventListener('resize', syncHdrHeight);

  // Hide settings button for non-admin users
  if (!IS_ADMIN) qs('#settings-btn').style.display = 'none';

  qs('#search').addEventListener('input', e => {
    clearTimeout(_st);
    _st = setTimeout(() => handleSearchInput(e.target.value), 240);
  });
  renderQueue();
  loadLanding();
});
</script>
</body>
