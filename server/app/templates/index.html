<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__SITE_TITLE__ — Library</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* The palette every GameSync client draws with (3ds/source/gui.h,
         desktop/theme.py, ...): navy, cyan accent, the logo's gradient. */
      --bg:           #0b1020;
      --bg-card:      #141b33;
      --bg-card-h:    #1d2746;
      --bg-input:     #0b1020;
      --bg-hdr:       rgba(11,16,32,.97);
      --border:       #36446e;
      --border-muted: #232d52;
      --text:         #eef2fa;
      --text-2:       #9ba9cd;
      --text-muted:   #6b789f;
      --accent:       #22c3f6;
      --accent-h:     #7bddff;
      --ink:          #0b1020;
      --green:        #3dd68c;
      --red:          #ff5d6c;
      --yellow:       #ffb938;
      --purple:       #c4a5ff;
      --brand:        linear-gradient(90deg, #00d6ff, #3a78ff 50%, #a45cff);
      --radius:       8px;
      --shadow:       0 8px 28px rgba(0,0,0,.55);
      --side-w:       236px;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px; line-height: 1.45; min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg-hdr); border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; align-items: center; flex-wrap: wrap;
      gap: 10px; padding: 7px 16px;
    }
    .logo {
      font-weight: 700; font-size: 15px; white-space: nowrap;
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: var(--text); flex-shrink: 0;
      /* Lines the search box up with the content column on desktop. */
      min-width: calc(var(--side-w) + 4px);
    }
    .logo-icon { width: 26px; height: 26px; display: block; }
    /* The gradient rule under the header: the one flourish every client shares. */
    header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: var(--brand);
    }
    .search-wrap { flex: 1; min-width: 160px; max-width: 560px; position: relative; }
    .search-wrap input {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text); padding: 6px 16px 6px 34px;
      font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(34,195,246,.15); }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 13px; pointer-events: none;
    }
    .tab-group { display: flex; gap: 2px; margin-left: auto; }
    .tab-btn {
      background: none; border: none; cursor: pointer; color: var(--text-2);
      padding: 6px 12px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
      transition: background .15s, color .15s; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    }
    .tab-btn:hover  { background: var(--bg-card); color: var(--text); }
    .tab-btn.active { background: var(--bg-card); color: var(--text); }
    .tab-count {
      background: var(--border); color: var(--text-muted);
      border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 600;
    }
    .tab-btn.active .tab-count { background: var(--accent); color: var(--ink); }
    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-2);
      padding: 6px; border-radius: var(--radius); font-size: 17px; line-height: 1;
      transition: color .15s; flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--text); }
    .queue-btn { position: relative; }
    .queue-badge {
      position: absolute; top: 1px; right: 0;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 999px; background: var(--accent); color: var(--ink);
      font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
    }
    .queue-badge.hidden { display: none; }
    .queue-btn.active { color: var(--text); background: var(--bg-card); }

    /* ── LAYOUT — the whole window, no centred column ── */
    #app {
      display: flex; padding: 12px 16px 40px; gap: 14px; align-items: flex-start;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--side-w); flex-shrink: 0;
      position: sticky; top: calc(var(--hdr-h, 50px) + 12px);
      max-height: calc(100vh - var(--hdr-h, 50px) - 24px);
      overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      background: var(--bg-card); border: 1px solid var(--border-muted);
      border-radius: var(--radius); padding: 8px 5px;
    }
    .sidebar-label {
      font-size: 10px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; padding-left: 9px;
    }
    .sys-link {
      display: flex; align-items: center; gap: 7px; padding: 2px 8px; border-radius: 5px;
      color: var(--text-2); font-size: 12px; cursor: pointer; line-height: 20px;
      transition: background .1s, color .1s; white-space: nowrap; overflow: hidden;
    }
    .sys-link:hover  { background: var(--bg-card-h); color: var(--text); }
    .sys-link.active { background: var(--bg-card-h); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
    .sys-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .sys-link-code { font-size: 11px; font-weight: 700; color: var(--text); width: 56px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
    .sys-link-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); font-size: 11px; }
    .sys-link.active .sys-link-name, .sys-link:hover .sys-link-name { color: var(--text-2); }
    .sys-link-cnt  { color: var(--text-muted); font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }

    /* ── CONTENT ── */
    #content { flex: 1; min-width: 0; }

    /* ── SUMMARY STRIP ── */
    .sum {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 22px;
      margin-bottom: 10px; font-size: 12px; color: var(--text-muted);
    }
    .sum b { font-size: 18px; font-weight: 700; color: var(--accent); margin-right: 5px; }

    /* ── BADGE ── */
    .badge {
      display: inline-block; color: #fff; font-size: 10px; font-weight: 700; line-height: 16px;
      padding: 0 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0;
    }

    /* ── VARIANT TAGS — what tells two files of one game apart ── */
    .tags { display: inline-flex; flex-wrap: wrap; gap: 3px; min-width: 0; max-width: 100%; }
    .tag {
      display: inline-block; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10px; line-height: 16px; padding: 0 5px; border-radius: 4px;
      border: 1px solid var(--border-muted); color: var(--text-2);
    }
    .tag.flag { color: var(--text-muted); }
    .tag.rev  { color: var(--yellow); border-color: rgba(255,185,56,.35); }
    .tag.disc { color: var(--yellow); border-color: rgba(255,185,56,.5); background: rgba(255,185,56,.08); font-weight: 600; }
    .tag.tr   { color: var(--accent); border-color: rgba(34,195,246,.45); background: rgba(34,195,246,.08); }
    .tag.hack { color: var(--purple); border-color: rgba(164,92,255,.5); background: rgba(164,92,255,.1); }
    .tag.kind { color: var(--green); border-color: rgba(61,214,140,.4); background: rgba(61,214,140,.08); font-weight: 600; }
    .aka {
      font-size: 11px; color: var(--text-muted); font-style: italic;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
    }

    .ra { font-size: 11px; color: var(--yellow); text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ra:hover { text-decoration: underline; }
    .ra.weak { color: var(--text-muted); }
    .save-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--green); white-space: nowrap; }
    .save-dot::before { content:''; display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    /* ── BUTTONS ── */
    .dl-btn {
      border: 1px solid var(--accent); border-radius: 5px; padding: 2px 7px;
      font-size: 10px; font-weight: 700; letter-spacing: .02em; line-height: 16px; cursor: pointer;
      transition: background .15s, opacity .15s;
      white-space: nowrap; display: inline-flex; align-items: center; gap: 3px;
      background: var(--accent); color: var(--ink);
    }
    .dl-btn:hover    { background: var(--accent-h); border-color: var(--accent-h); }
    .dl-btn:disabled { opacity: .45; cursor: not-allowed; }
    .dl-btn.busy     { background: var(--yellow) !important; color: #000 !important; border-color: var(--yellow) !important; }
    .dl-btn.extract {
      background: transparent; color: var(--green); border-color: rgba(61,214,140,.4);
    }
    .dl-btn.extract:hover:not(:disabled) { background: rgba(63,185,80,.1); border-color: var(--green); }
    /* Copy-link button: subtle outline so it doesn't compete with the downloads */
    .dl-btn.copy {
      background: transparent; color: var(--text-2); border-color: var(--border-muted); padding: 2px 5px;
    }
    .dl-btn.copy:hover:not(:disabled) { background: rgba(34,195,246,.1); border-color: var(--accent); color: var(--accent); }
    .rom-btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

    /* ── ROM LIST — dense rows, the default ── */
    .rom-list {
      background: var(--bg-card); border: 1px solid var(--border-muted);
      border-radius: var(--radius); overflow: hidden;
    }
    .rom-row {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 10px 4px 0; min-height: 30px;
      border-bottom: 1px solid var(--border-muted);
    }
    .rom-row:last-child { border-bottom: none; }
    .rom-row:hover { background: var(--bg-card-h); }
    .row-stripe { width: 3px; align-self: stretch; flex-shrink: 0; }
    .row-main { flex: 1; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 7px; }
    .rt { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .row-ra   { width: 56px; flex-shrink: 0; text-align: right; }
    .row-save { width: 42px; flex-shrink: 0; }
    .row-size { width: 62px; flex-shrink: 0; text-align: right; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rom-row .rom-btns { flex-shrink: 0; flex-wrap: nowrap; }

    /* ── ROM CARD GRID ── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
    .rom-card {
      background: var(--bg-card); border: 1px solid var(--border-muted);
      border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
      transition: border-color .15s;
    }
    .rom-card:hover { border-color: var(--border); }
    .rom-stripe { height: 3px; }
    .rom-body { padding: 8px 10px 6px; flex: 1; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
    .rom-title {
      font-size: 13px; font-weight: 500; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .rom-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; width: 100%; }
    .rom-size { font-size: 11px; color: var(--text-muted); }
    .rom-foot { padding: 6px 8px; border-top: 1px solid var(--border-muted); }
    .rom-foot .rom-btns { justify-content: flex-start; }
    .rom-foot .dl-btn.copy { margin-left: auto; }

    /* ── SAVES TABLE ── */
    table.tbl {
      width: 100%; border-collapse: separate; border-spacing: 0; background: var(--bg-card);
      border: 1px solid var(--border-muted); border-radius: var(--radius);
    }
    .tbl th {
      position: sticky; top: var(--hdr-h, 50px); z-index: 5;
      background: #0f1630; text-align: left; padding: 6px 10px; font-size: 10px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none;
    }
    .tbl th:first-child { border-top-left-radius: var(--radius); }
    .tbl th:last-child  { border-top-right-radius: var(--radius); }
    .tbl th[data-action] { cursor: pointer; }
    .tbl th[data-action]:hover, .tbl th.sorted { color: var(--text); }
    .tbl td { padding: 4px 10px; border-bottom: 1px solid var(--border-muted); vertical-align: middle; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--bg-card-h); }
    .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
    .save-game { font-weight: 500; font-size: 13px; }
    .save-id, .save-hash { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, Consolas, monospace; }
    .save-id { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .save-date { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .save-size { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .save-act  { white-space: nowrap; text-align: right; }
    .save-act .dl-btn { vertical-align: middle; }

    /* ── MODALS ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.72);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px; width: 360px; max-width: 92vw; box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 17px; margin-bottom: 6px; }
    .modal p  { color: var(--text-2); font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    .modal-sec-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .btn-ghost {
      background: none; color: var(--text-2); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 18px; font-size: 14px; cursor: pointer; transition: background .15s;
    }
    .btn-ghost:hover { background: var(--bg-card-h); color: var(--text); }
    .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }

    /* ── DOWNLOAD QUEUE PANEL ── */
    .queue-panel {
      position: fixed; top: calc(var(--hdr-h, 50px) + 10px); right: 16px;
      width: 380px; max-width: calc(100vw - 24px); max-height: calc(100vh - var(--hdr-h, 50px) - 28px);
      overflow: auto; z-index: 180;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: var(--shadow); padding: 16px;
    }
    .queue-panel.hidden { display: none; }
    .queue-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 14px;
    }
    .queue-title { font-size: 15px; font-weight: 700; }
    .queue-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .queue-head-actions { display: flex; align-items: center; gap: 8px; }
    .queue-section { margin-top: 14px; }
    .queue-section:first-child { margin-top: 0; }
    .queue-label {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
    }
    .queue-list { display: flex; flex-direction: column; gap: 8px; }
    .queue-item {
      border: 1px solid var(--border-muted); border-radius: 10px;
      padding: 10px 12px; background: rgba(255,255,255,.01);
    }
    .queue-item-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .queue-item-title {
      font-size: 13px; font-weight: 600; line-height: 1.35;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .queue-item-meta {
      font-size: 11px; color: var(--text-muted); margin-top: 5px;
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .queue-item-status { font-size: 12px; color: var(--text-2); margin-top: 8px; }
    .queue-item-sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .queue-item-actions { display: flex; align-items: center; gap: 6px; }
    .queue-mini-btn {
      background: none; color: var(--text-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 8px; font-size: 11px; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .queue-mini-btn:hover { background: var(--bg-card-h); color: var(--text); border-color: var(--border); }
    .queue-mini-btn.danger:hover { color: var(--red); border-color: var(--red); }
    .queue-empty {
      font-size: 12px; color: var(--text-muted); text-align: center;
      padding: 18px 12px; border: 1px dashed var(--border); border-radius: 10px;
    }
    .queue-state {
      border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
      border: 1px solid transparent;
    }
    .queue-state.running { background: rgba(210,153,34,.16); color: var(--yellow); border-color: rgba(210,153,34,.4); }
    .queue-state.queued { background: rgba(34,195,246,.12); color: var(--accent-h); border-color: rgba(34,195,246,.35); }
    .queue-state.done { background: rgba(63,185,80,.12); color: var(--green); border-color: rgba(63,185,80,.35); }
    .queue-state.error { background: rgba(248,81,73,.12); color: var(--red); border-color: rgba(248,81,73,.35); }
    .queue-state.cancelled { background: rgba(139,148,158,.14); color: var(--text-2); border-color: rgba(139,148,158,.3); }
    .queue-progress { margin-top: 10px; }
    .queue-progress .prog-track { margin-bottom: 0; }

    .conv-fmt-badge {
      background: rgba(61,214,140,.12); color: var(--green); border: 1px solid rgba(61,214,140,.4);
      border-radius: 4px; padding: 1px 7px; font-size: 10px; font-weight: 700;
      text-transform: uppercase;
    }

    /* progress bar */
    .prog-track {
      height: 6px; background: var(--border-muted); border-radius: 3px; overflow: hidden; margin-bottom: 14px;
    }
    .prog-bar {
      height: 100%; border-radius: 3px; background: var(--green);
      width: 0%; transition: width .4s ease;
    }
    .prog-bar.indeterminate {
      width: 40%;
      animation: indeterminate 1.4s ease-in-out infinite;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-200%); }
      100% { transform: translateX(350%); }
    }

    /* ── SKELETON ── */
    .skeleton { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .6; } 50% { opacity: .2; } }
    .skel-row { height: 30px; border-bottom: 1px solid var(--border-muted); background: var(--bg-card); }

    /* ── SYSTEM OVERVIEW GRID (landing screen) ── */
    .sys-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
    .sys-tile {
      position: relative; background: var(--bg-card); border: 1px solid var(--border-muted);
      border-radius: var(--radius); padding: 8px 12px 9px 15px;
      cursor: pointer; overflow: hidden;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .sys-tile:hover  { border-color: var(--border); background: var(--bg-card-h); }
    .sys-tile-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .sys-tile-top   { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .sys-tile-code  { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .sys-tile-cnt   { font-size: 15px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    .sys-tile-name  { font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── STICKY VIEW HEADER (context bar + alphabet jump) ── */
    /* Stays pinned under the page header (and the chip bar on mobile) while
       the list scrolls underneath. */
    .view-head {
      position: sticky; top: calc(var(--hdr-h, 50px) + var(--chips-h, 0px)); z-index: 80;
      background: var(--bg); margin: -12px 0 8px; padding-top: 10px;
    }
    .ctx-bar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
    .ctx-bar h2 { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .ctx-count { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .back-btn {
      background: var(--bg-card); border: 1px solid var(--border-muted); color: var(--text-2);
      border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 12px;
      display: inline-flex; align-items: center; gap: 5px;
      transition: background .12s, color .12s, border-color .12s;
    }
    .back-btn:hover { background: var(--bg-card-h); color: var(--text); border-color: var(--border); }

    /* ── FILTER PILLS ── */
    .flts { display: flex; gap: 5px; flex-wrap: wrap; }
    .flt {
      background: var(--bg-card); border: 1px solid var(--border-muted); color: var(--text-2);
      border-radius: 999px; padding: 2px 10px; font-size: 11px; cursor: pointer; white-space: nowrap;
      transition: background .12s, color .12s, border-color .12s;
    }
    .flt span { color: var(--text-muted); margin-left: 3px; font-variant-numeric: tabular-nums; }
    .flt:hover  { color: var(--text); border-color: var(--border); }
    .flt.active { background: rgba(34,195,246,.14); border-color: var(--accent); color: var(--accent); }
    .flt.active span { color: var(--accent); }

    /* ── VIEW TOGGLE (list / grid) ── */
    .view-toggle {
      margin-left: auto; display: flex; gap: 2px;
      background: var(--bg-card); border: 1px solid var(--border-muted);
      border-radius: 7px; padding: 2px; flex-shrink: 0;
    }
    .vt-btn {
      background: none; border: none; cursor: pointer; color: var(--text-2);
      padding: 2px 8px; border-radius: 5px; font-size: 13px; line-height: 1.3;
      transition: background .12s, color .12s;
    }
    .vt-btn:hover  { color: var(--text); }
    .vt-btn.active { background: var(--accent); color: var(--ink); }

    /* ── ALPHABET JUMP STRIP ── */
    .alpha-bar { display: flex; flex-wrap: wrap; gap: 1px; padding: 6px 0; border-bottom: 1px solid var(--border-muted); }
    .alpha-btn {
      min-width: 22px; height: 20px; padding: 0 4px;
      background: none; border: 1px solid transparent; border-radius: 5px;
      color: var(--text-2); font-size: 11px; font-weight: 600; cursor: pointer;
      transition: background .1s, color .1s, border-color .1s;
    }
    .alpha-btn:hover { background: var(--bg-card); color: var(--text); border-color: var(--border); }
    .alpha-btn:disabled, .alpha-btn.off { color: var(--border); cursor: default; background: none; border-color: transparent; }

    /* Quick-jump target offset: clear everything that is pinned above. */
    .card-grid > *, .rom-list > * {
      scroll-margin-top: calc(var(--hdr-h, 50px) + var(--chips-h, 0px) + var(--vh-h, 70px) + 4px);

    .load-more { padding: 18px; text-align: center; color: var(--text-muted); font-size: 12px; }

    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    .empty-sub   { font-size: 13px; max-width: 380px; margin: 0 auto; line-height: 1.6; }

    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 9px; padding: 10px 22px; font-size: 13px;
      box-shadow: var(--shadow); z-index: 400;
      transition: opacity .25s, transform .25s;
      opacity: 0; pointer-events: none; max-width: 92vw;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err  { border-color: var(--red);   color: var(--red);   }
    #toast.ok   { border-color: var(--green); color: var(--green); }

    /* ── SYSTEM CHIPS (mobile horizontal scroll bar) ── */
    #sys-chips { display: none; }
    .sys-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 11px; border-radius: 20px;
      border: 1px solid var(--border-muted);
      background: var(--bg-card); color: var(--text-2);
      font-size: 12px; font-weight: 600; white-space: nowrap;

    .sys-chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .sys-chip-cnt { font-size: 11px; color: var(--text-muted); margin-left: 1px; }

    /* ── RESPONSIVE — narrow desktop: drop the secondary save columns ── */
    @media (max-width: 1280px) {
      .tbl .c-hash, .tbl .c-src { display: none; }
    }

    /* ── RESPONSIVE — tablet ── */
    @media (max-width: 900px) {
      #sidebar { display: none; }
      .logo { min-width: 0; }
      #sys-chips {
        display: flex; gap: 6px;
        overflow-x: auto; overflow-y: visible;

        background: var(--bg);

        /* fade edges to hint at scrollability */

        mask-image: linear-gradient(to right, transparent 0, black 16px, black calc(100% - 16px), transparent 100%);
        scrollbar-width: none; -ms-overflow-style: none;
      }
      #sys-chips::-webkit-scrollbar { display: none; }
      #app { padding: 12px 12px 32px; gap: 0; }
      .tbl .c-id, .tbl .c-files { display: none; }
      .tbl th { position: static; }
      .tbl-wrap { overflow-x: auto; }

      /* Rows fold: name and tags on top, the facts and buttons beneath. */
      .rom-row { flex-wrap: wrap; gap: 4px 10px; padding: 6px 8px 6px 0; }
      .row-main { flex-basis: calc(100% - 13px); }
      .row-stripe { margin-right: -3px; }
      .row-ra, .row-save, .row-size { width: auto; text-align: left; }
      .row-ra:empty, .row-save:empty { display: none; }
      .row-ra { margin-left: 10px; }
      .rom-row .rom-btns { margin-left: auto; flex-wrap: wrap; }
      .dl-btn { padding: 4px 8px; }
      .dl-btn.copy { padding: 4px 7px; }
    }

    /* ── RESPONSIVE — phone ── */
    @media (max-width: 600px) {
      header { padding: 8px 12px; gap: 8px; }

      /* Row 1: logo (left) + queue/settings (right) */
      .logo     { order: 1; flex: 1; }
      .icon-btn { order: 2; }

      /* Row 2: search (left) + tabs (right) */
      .search-wrap { order: 3; flex: 1; min-width: 0; max-width: none; }
      .tab-group   { order: 4; flex-shrink: 0; margin-left: 0; }

      .tab-count { display: none; } /* counts shown in chips instead */

      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .sys-grid  { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .tbl .c-size { display: none; }

      .modal { width: 94vw; padding: 20px; }
      .queue-panel {
        right: 10px; left: 10px; width: auto;
        max-width: none; top: calc(var(--hdr-h, 50px) + 8px);

  </style>

<script>
// Injected server-side. The key is only baked in for an authenticated
// request; otherwise it arrives empty and we fall back to a key the user
// pastes once and we keep in localStorage. This stops the server from
// handing the API key to any anonymous visitor who loads this page.
let API_KEY  = '__API_KEY__';
const IS_ADMIN = __IS_ADMIN__;

if (!API_KEY) {
  API_KEY = localStorage.getItem('gamesync_api_key') || '';
  if (!API_KEY) {
    const entered = window.prompt('Enter the GameSync API key to access the library:');
    if (entered) {
      API_KEY = entered.trim();
      localStorage.setItem('gamesync_api_key', API_KEY);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
// View model for the ROM side of the library:
//   view: 'overview'  -> system picker grid (landing screen, tiny payload)
//         'system'    -> one system's ROMs, lazy-rendered
//         'search'    -> server-side search results, grouped by system
//   stats           -> {SYS: count} — populated from /roms/systems
//   systemCache     -> {SYS: [rom, ...]} — per-system fetch cache so re-entry is instant
//   currentSystem   -> which system is being viewed (when view === 'system')
//   savedTitleIds   -> Set<title_id> — used to flag ROMs that have saves on server
//   searchResults   -> last search: {q, total, roms}
//   Every ROM object gets `_d` (prepRom): the title, variant tags and sort
//   key it is displayed with.
//   searchAbort     -> AbortController for the in-flight search request
const S = {
  view:          'overview',
  stats:         {},
  systemCache:   {},
  currentSystem: null,
  savedTitleIds: new Set(),
  saves:         [],
  searchResults: null,
  searchAbort:   null,
  tab:           'roms',
  q:             '',
  // List (dense rows) vs grid (cards). Persisted across sessions.
  layout:        localStorage.getItem('gamesync_layout') === 'grid' ? 'grid' : 'list',
  // Client-side narrowing of the system / search view being shown.
  filters:       { save: false, ra: false, patched: false },
  // Saves tab: platform shown (null = all) and the column sorted by.
  savePlat:      null,
  saveSort:      { key: 'date', dir: -1 },
  // Lazy render state — reused by both the system view and search view
  lazy: { items: [], rendered: 0, observer: null, containerId: null, renderFn: null },
};
const Q = { items: [], nextId: 1, activeId: null };
let _convAbort = null;  // AbortController for active queued conversion

// Lazy-render config: enough cards to fill a mobile viewport plus some headroom,
// but small enough that a single batch doesn't cause jank.
const LAZY_BATCH = 60;
// Hard ceiling on server-side search results shown to the UI. The server is
// fine with more, but 40k matches rendered all at once defeats the purpose.
const SEARCH_CAP = 400;

// ═══════════════════════════════════════════════════════
//  SYSTEM METADATA
// ═══════════════════════════════════════════════════════
const SYS_CLR = {
  GBA:'#7c3aed', GBC:'#15803d', GB:'#3f6212',
  SNES:'#1d4ed8', NES:'#b91c1c', FDS:'#9a1818',
  N64:'#92400e', GC:'#6d28d9', WII:'#4338ca', WIIU:'#3730a3',
  NDS:'#9d174d', '3DS':'#0e7490', DSI:'#0891b2',
  PSP:'#1e3a8a', VITA:'#881337',
  PS1:'#374151', PSX:'#374151', PS2:'#1e3a8a', PS3:'#0c4a6e',
  SAT:'#7f1d1d', SCD:'#134e4a', MEGACD:'#134e4a', SEGACD:'#134e4a', DC:'#f97316',
  SG1000:'#065f46', XBOX:'#107c10', N64DD:'#78350f', VB:'#991b1b',
  WSWAN:'#0f766e', WSWANC:'#0d9488', X68K:'#475569', PCSG:'#78350f', NEOCD:'#7f1d1d',
  MD:'#134e4a', SMS:'#064e3b', GG:'#14532d', '32X':'#6d28d9',
  PCE:'#78350f', TG16:'#78350f', PCECD:'#92400e', TG16CD:'#92400e',

  NGPC:'#991b1b', NGP:'#991b1b', NGC:'#7f1d1d',
  A2600:'#b45309', ATARI2600:'#b45309',
  A5200:'#92400e', ATARI5200:'#92400e',
  A7800:'#78350f', ATARI7800:'#78350f',

  LYNX:'#854d0e',

const SYS_LBL = {

  PS1:'PlayStation', PSX:'PlayStation', PS2:'PlayStation 2', PS3:'PlayStation 3',
  SAT:'Sega Saturn', SCD:'Sega CD', MEGACD:'Sega Mega-CD', SEGACD:'Sega CD', DC:'Dreamcast',
  SG1000:'Sega SG-1000', XBOX:'Xbox', N64DD:'Nintendo 64DD', VB:'Virtual Boy',
  WSWAN:'WonderSwan', WSWANC:'WonderSwan Color', X68K:'Sharp X68000', PCSG:'PC Engine SuperGrafx', NEOCD:'Neo Geo CD',
  MD:'Mega Drive / Genesis', SMS:'Sega Master System', GG:'Game Gear', '32X':'Sega 32X',
  PCE:'PC Engine', TG16:'TurboGrafx-16', PCECD:'PC Engine CD-ROM²', TG16CD:'TurboGrafx-CD',

  NGPC:'Neo Geo Pocket Color', NGP:'Neo Geo Pocket', NGC:'Neo Geo Color',
  A2600:'Atari 2600', ATARI2600:'Atari 2600',
  A5200:'Atari 5200', ATARI5200:'Atari 5200',
  A7800:'Atari 7800', ATARI7800:'Atari 7800',
  A800:'Atari 8-bit', ATARIXED:'Atari XE',

  ATARIST:'Atari ST',
  LYNX:'Atari Lynx',
  MSDOS:'MS-DOS', DOS:'MS-DOS',
  FBNEO:'Final Burn Neo', FBA:'Final Burn Alpha', ARCADE:'Arcade', MAME:'MAME',
  CPS1:'CPS1', CPS2:'CPS2', CPS3:'CPS3',
  NEOGEO:'Neo Geo', NAOMI:'Sega NAOMI', NAOMI2:'Sega NAOMI 2',

const clr = s => SYS_CLR[(s||'').toUpperCase()] || '#374151';
const lbl = s => SYS_LBL[(s||'').toUpperCase()] || s || 'Unknown';

// ═══════════════════════════════════════════════════════
//  HTTP
// ═══════════════════════════════════════════════════════
async function api(path) {
  const r = await fetch(path, { headers: { 'X-API-Key': API_KEY } });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// Append the API key as a query param so a plain <a href> can authenticate.
// The auth middleware already accepts both X-API-Key header AND ?api_key=...
// (server/app/middleware/auth.py), so this is just a UX layer.
function withAuth(url) {
  return url + (url.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(API_KEY);
}

// Raw ROM / save downloads now use a native browser download instead of
// fetch().blob(). Reasons:
//   - fetch().blob() buffers the WHOLE response in browser RAM — fatal for
//     a 4 GB PS2 ISO on a phone.
//   - Native downloads stream straight to disk, show the browser's progress
//     bar, and survive backgrounding the tab on mobile.
//   - The browser issues HTTP Range automatically and can resume on
//     interruptions when the server advertises Accept-Ranges (we do).
// This means we can't show a per-button spinner during the transfer (the
// browser owns the UI now), but we briefly flash a "started" hint so the
// user knows the click registered.
function dlFile(url, filename, btn) {
  const a = document.createElement('a');
  a.href = withAuth(url);
  if (filename) a.download = filename;
  // Some mobile browsers ignore the download attribute on cross-origin /
  // proxied responses but still trigger a download because of the server's
  // Content-Disposition header — that's fine, the filename comes from there.
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast(`⬇ ${filename || 'Download started'}`, 'ok');

  // Brief visual ack on the clicked button.
  if (btn) {
    const origTxt = btn.textContent;
    btn.disabled = true; btn.classList.add('busy'); btn.textContent = '…';
    setTimeout(() => {
      btn.disabled = false; btn.classList.remove('busy');
      btn.textContent = origTxt || '↓';
    }, 900);
  }
}

// Copy a shareable absolute URL to the clipboard.  We DO NOT embed the
// API key — instead we ask the server to mint an HMAC-signed token
// scoped to (path, expiry).  The recipient gets a self-contained URL
// that works without their own API key, the api_key never leaves the
// authenticated session, and rotating the key revokes every old share
// link in one move.
//
// Only wired up on direct-download buttons — extract/conversion routes
// are excluded because they're not idempotent (depend on cache state)
// and produce streaming responses that don't survive cold link replays.
async function copyLink(url, btn) {
  // Strip any prior query params (e.g. ?api_key=…) — we sign the bare
  // path only.  ``url`` here is already path-relative ("/api/v1/...").
  const barePath = url.split('?', 1)[0];

  let signedPath;
  try {
    const data = await api(
      `/api/v1/roms/share-link?path=${encodeURIComponent(barePath)}`
    );
    if (!data || !data.url) throw new Error('Server returned no url');
    signedPath = data.url;
  } catch (e) {
    toast('Could not create share link: ' + (e.message || e), 'err');
    return;
  }
  const full = location.origin + signedPath;

  const ok = () => {
    toast('🔗 Share link copied (no API key)', 'ok');
    if (btn) {
      const orig = btn.textContent;
      btn.classList.add('busy'); btn.textContent = '✓';
      setTimeout(() => { btn.classList.remove('busy'); btn.textContent = orig; }, 900);
    }
  };
  const fail = () => toast('Copy failed — link: ' + full, 'err');

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(full).then(ok, fail);
    return;
  }
  // Fallback for plain http:// (LAN deployments) where the async clipboard
  // API is gated behind a secure context.
  const ta = document.createElement('textarea');
  ta.value = full;
  ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    if (document.execCommand('copy')) ok(); else fail();
  } catch (e) { fail(); }
  document.body.removeChild(ta);
}

// Used by the extract queue (CHD → ISO etc) which DOES want the fetch()
// path so it can show "now converting" progress and stage messages while
// the server runs chdman / DolphinTool / etc. With the server now streaming
// the result from a temp file (instead of buffering), the browser side is
// the only thing still buffered — but extracts are typically <2 GB.
function triggerDownload(blob, filename) {
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: filename,
  });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 15000);
}

// ═══════════════════════════════════════════════════════
//  DOWNLOAD QUEUE

const STAGES = {
